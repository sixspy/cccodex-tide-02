name: tide-telegram-intake-tide-02

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3222:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "8222:8000"
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/tidetelegram
      # 从环境或 .env 取；不写死，免得仓库里的固定密钥能签出任意角色。
      JWT_SECRET: ${JWT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tidetelegram
    ports:
      - "54422:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tidetelegram"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
